name: Apply and validate reservation pass

on:
  push:
    branches: [chatgpt/reservation-pass-2]
    paths:
      - '.maintenance/reservation-pass2.chunk*'
      - '.github/workflows/apply-reservation-pass.yml'

permissions:
  contents: write

concurrency:
  group: apply-reservation-pass-2
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/reservation-pass-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allo_moto_test
          POSTGRES_PASSWORD: disposable-test-password
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-verified reviewed source patch
        run: |
          git merge-base --is-ancestor c986938b2cf52998b7096dfd0c2a9bcf8becca40 HEAD
          cat .maintenance/reservation-pass2.chunk{0,1,2,3} | base64 -d | xz -dc > /tmp/reservation-pass2.patch
          echo '99ef8e87d53f77fdb36da51de9418ebad2881ca7b644ffc33a6bef8d68bb9aec  /tmp/reservation-pass2.patch' | sha256sum --check --strict
          git apply --check --exclude=.github/workflows/quality.yml /tmp/reservation-pass2.patch
          git apply --exclude=.github/workflows/quality.yml /tmp/reservation-pass2.patch
      - name: Commit application source to dedicated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests docs
          git commit -m 'fix: unify rental calendar, future availability and idempotent submissions'
          git push origin HEAD:refs/heads/chatgpt/reservation-pass-2
      - run: npm ci
        id: install
      - run: npm run lint -- --max-warnings=0
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-test-password@localhost:5432/allo_moto_test
      - run: npm run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm audit --audit-level=moderate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
