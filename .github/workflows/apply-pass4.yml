name: Apply reviewed pass 4
on:
  push:
    branches: [chatgpt/reliability-pass-4]
    paths: [.github/workflows/apply-pass4.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed patch on dedicated branch
        run: |
          git merge-base --is-ancestor a6f39c2771cd92df2fcb472a4e0e8135b79faa92 HEAD
          cat .maintenance/pass4.chunk{0,1,2} | base64 -d | xz -dc > /tmp/pass4.patch
          echo '07d22b5e02a7d0e33a97fa697e24bf6c8a725cca828b4969510804fbbef2e244  /tmp/pass4.patch' | sha256sum --check --strict
          git apply --check /tmp/pass4.patch
          git apply /tmp/pass4.patch
          rm .maintenance/pass4.chunk{0,1,2} .github/workflows/apply-pass4.yml
          git add -A
          test "$(git write-tree)" = da800e3af4d895c6b8916e6421131d394d61f91d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: accepted pricing, independent private receipts and concurrent fleet edits'
          git push origin HEAD:refs/heads/chatgpt/reliability-pass-4
          git rev-parse HEAD HEAD^{tree}
