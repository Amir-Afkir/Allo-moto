name: Quality

on:
  push:
    branches: [main, chatgpt/security-data-pass-1, chatgpt/reservation-pass-2, chatgpt/quality-pass-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allo_moto_test
          POSTGRES_PASSWORD: disposable-test-password
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        id: install
      - run: npm run lint -- --max-warnings=0
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-test-password@localhost:5432/allo_moto_test
      - run: npm run test:production
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm audit --audit-level=moderate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Install browser engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit
      - name: Create disposable browser database
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: createdb -h 127.0.0.1 -U postgres allo_moto_e2e
        env:
          PGPASSWORD: disposable-test-password
      - name: Enable TLS on disposable PostgreSQL
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: disposable-test-password
          PGDATABASE: allo_moto_e2e
        run: |
          test "$GITHUB_ACTIONS" = true
          test -n "$PG_CONTAINER"
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$directory/server.key" -out "$directory/server.crt" >/dev/null 2>&1
          docker cp "$directory/server.key" "$PG_CONTAINER:/tmp/e2e-postgres.key"
          docker cp "$directory/server.crt" "$PG_CONTAINER:/tmp/e2e-postgres.crt"
          docker exec "$PG_CONTAINER" sh -c 'chown postgres:postgres /tmp/e2e-postgres.key /tmp/e2e-postgres.crt && chmod 600 /tmp/e2e-postgres.key'
          psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/e2e-postgres.crt'"
          psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file = '/tmp/e2e-postgres.key'"
          psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = on"
          psql -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
          for attempt in $(seq 1 10); do
            if PGSSLMODE=require psql -tAc 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          echo 'Disposable PostgreSQL TLS is not ready.' >&2
          exit 1
      - name: Browser regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:disposable-test-password@127.0.0.1:5432/allo_moto_e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
      - name: Report full dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --json > /tmp/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: dependency-audit
          path: /tmp/npm-audit.json
          retention-days: 7
