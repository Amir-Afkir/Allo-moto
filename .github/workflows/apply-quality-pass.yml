name: Apply and validate quality pass
on:
  push:
    branches: [chatgpt/quality-pass-3]
    paths: [.github/workflows/apply-quality-pass.yml, .maintenance/quality-pass3.chunk*]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allo_moto_test
          POSTGRES_PASSWORD: disposable-test-password
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source patch
        run: |
          git merge-base --is-ancestor 7e08deb807e4cc2b41a0c8f8c86f773dbb6b5709 HEAD
          cat .maintenance/quality-pass3.chunk{0,1,2,3} | base64 -d | xz -dc > /tmp/quality-pass3.patch
          echo 'efdeabc4d7e50556c3aaf3a296775acc9dfbafc99436835d5fb60f610e3dc934  /tmp/quality-pass3.patch' | sha256sum --check --strict
          git apply --check /tmp/quality-pass3.patch
          git apply /tmp/quality-pass3.patch
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit application source and lockfile on dedicated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app e2e tests docs playwright.config.ts package.json package-lock.json next.config.ts eslint.config.mjs .gitignore
          git commit -m 'fix: reliable image uploads, validated fleet forms and browser regressions'
          git push origin HEAD:refs/heads/chatgpt/quality-pass-3
      - name: Export candidate source
        run: git archive --format=zip --output=/tmp/quality-candidate.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quality-candidate-source
          path: /tmp/quality-candidate.zip
          retention-days: 1
      - run: npm ci
        id: install
      - run: npm run lint -- --max-warnings=0
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-test-password@localhost:5432/allo_moto_test
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm audit --audit-level=moderate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Install browser engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit
      - name: Create disposable browser database
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: createdb -h 127.0.0.1 -U postgres allo_moto_e2e
        env:
          PGPASSWORD: disposable-test-password
      - name: Browser regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:disposable-test-password@127.0.0.1:5432/allo_moto_e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
