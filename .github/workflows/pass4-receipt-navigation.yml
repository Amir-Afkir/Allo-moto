name: Apply receipt navigation correction
on:
  push:
    branches: [chatgpt/reliability-pass-4]
    paths: [.github/workflows/pass4-receipt-navigation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed correction
        run: |
          git merge-base --is-ancestor cf536f39789e6d88e6c47094dbb0bab3ee5833e9 HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('app/_features/reservation/components/ReservationTunnel.tsx')
          s=p.read_text()
          old='          return <Link key={receipt.id} href={`/reserver?${params}`} className="text-sm underline">{receipt.reference}</Link>;'
          new='          // A receipt switch starts from its explicit URL and fresh server data.\n          // Do not reuse the current receipt\'s in-flight client-router transition.\n          return <a key={receipt.id} href={`/reserver?${params}`} className="text-sm underline">{receipt.reference}</a>;'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('e2e/reliability.spec.ts');s=p.read_text()
          old='''    await fresh.goto("/reserver?stage=confirmed");
              await expect(fresh.getByRole("navigation", { name: "Vos demandes dans ce navigateur" }).getByRole("link")).toHaveCount(2);
              await fresh.getByRole("link", { name: first.reference, exact: true }).click();
              await expect(fresh.locator("#confirmation")).toContainText(first.reference);'''
          new='''    // Switch both ways repeatedly: the newest receipt must never replace the selected one.
              for (const selected of [first, second, first]) {
                await fresh.goto("/reserver?stage=confirmed");
                await expect(fresh.getByRole("navigation", { name: "Vos demandes dans ce navigateur" }).getByRole("link")).toHaveCount(2);
                await fresh.getByRole("link", { name: selected.reference, exact: true }).click();
                await expect(fresh).toHaveURL((url) => url.searchParams.get("reservationId") === selected.id);
                await expect(fresh.locator("#confirmation")).toContainText(selected.reference);
                await expect(fresh.getByLabel("Montants enregistrés")).toContainText(String(selected.pricing.estimatedTotal));
              }'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('docs/RELIABILITY_PASS_4.md');s=p.read_text()
          old='Le tunnel consulte les cookies même si sessionStorage est vide ou inaccessible.'
          new='Le tunnel consulte les cookies même si sessionStorage est vide ou inaccessible. Le choix d’un reçu dans la liste utilise une navigation complète vers son URL explicite pour ne pas réutiliser une transition client de la demande précédente ; les liens entre étapes du dossier restent sans rechargement.'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          test "$(git hash-object app/_features/reservation/components/ReservationTunnel.tsx)" = 21dd25dbb9203ef7cddfb01722f5795f999e591e
          test "$(git hash-object e2e/reliability.spec.ts)" = 4fcf0491ecf072182287e20b282d3f3b1eecd7f6
          test "$(git hash-object docs/RELIABILITY_PASS_4.md)" = ac0050e59e6bd5ce98f94f354412cb2639d0ba10
          git add app/_features/reservation/components/ReservationTunnel.tsx e2e/reliability.spec.ts docs/RELIABILITY_PASS_4.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: navigate explicitly between independent private receipts'
          git push origin HEAD:refs/heads/chatgpt/reliability-pass-4
