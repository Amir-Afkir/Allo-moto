name: Finalize security pass dependencies

on:
  push:
    branches: [chatgpt/security-data-pass-1]
    paths: ['.maintenance/finalize-security-pass.py']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/security-data-pass-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .maintenance/finalize-security-pass.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit patched dependency graph and reviewed integration fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs package.json package-lock.json
          git commit -m 'fix: integrate retained statuses and patched image/CSS dependencies'
          git push origin HEAD:refs/heads/chatgpt/security-data-pass-1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - name: Export final source for review
        if: always()
        run: git archive --format=zip --output=/tmp/final-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-pass-final-source
          path: /tmp/final-source.zip
          retention-days: 1
